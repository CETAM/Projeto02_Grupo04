<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro do Cliente</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
        .form-container { max-width: 500px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Cadastro de Cliente</h2>
    <form th:action="@{/pessoa}" method="post">

        <div class="form-group">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        </div>

        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>
        <div class="form-group">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>
        <div class="form-group">
            <label for="tipoPessoa">Tipo de Pessoa:</label>
            <select id="tipoPessoa" name="tipoPessoa" required>
                <option value="">Selecione...</option>
                <option value="Cliente">Cliente</option>
                <option value="Funcionario">Funcionário</option>
                <option value="Fornecedor">Fornecedor</option>
            </select>
        </div>
        <div class="form-group">
            <label for="telefone">Telefone / WhatsApp:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(92) 99999-9999">
        </div>

        <div class="form-group">
            <label for="endereco">Endereço de Entrega:</label>
            <input type="text" id="endereco" name="endereco" placeholder="Rua, Número, Bairro">
        </div>

        <button type="submit">Salvar Cadastro</button>


    </form>
</div>

</body>
</html>
